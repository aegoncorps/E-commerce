<!-- Modal de Busca Rápida (Bootstrap Modal) -->
<div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content aegon-surface-card border-secondary">
      <div class="modal-header border-bottom border-secondary border-opacity-25 px-4 py-3">
        <div class="d-flex align-items-center gap-2 w-100">
          <svg class="bi bi-search text-primary flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
          </svg>
          <input
            type="search"
            id="modal-search-input"
            class="form-control bg-transparent border-0 text-light shadow-none fs-5"
            placeholder="Buscar garrafas, camisas, cadernos ou combos..."
            aria-label="Buscar no catálogo AEGON"
            autocomplete="off"
          >
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>

      <div class="modal-body p-4">
        <!-- Atalhos de Tags -->
        <div class="mb-3 d-flex flex-wrap align-items-center gap-2">
          <span class="text-uppercase small fw-bold text-secondary me-1" style="letter-spacing: 0.12em; font-size: 0.7rem;">Sugestões:</span>
          <a href="#/produtos?tag=Combos" class="badge rounded-pill text-bg-dark border border-secondary text-decoration-none px-3 py-2 search-quick-tag">Combos</a>
          <a href="#/produtos?tag=Camisas" class="badge rounded-pill text-bg-dark border border-secondary text-decoration-none px-3 py-2 search-quick-tag">Camisas</a>
          <a href="#/produtos?tag=Garrafas" class="badge rounded-pill text-bg-dark border border-secondary text-decoration-none px-3 py-2 search-quick-tag">Garrafas</a>
          <a href="#/produtos?tag=Cadernos" class="badge rounded-pill text-bg-dark border border-secondary text-decoration-none px-3 py-2 search-quick-tag">Cadernos</a>
        </div>

        <!-- Resultados Instantâneos -->
        <div id="modal-search-results" class="list-group list-group-flush rounded-3 overflow-hidden">
          <!-- Preenchido dinamicamente pelo JS -->
        </div>
      </div>
    </div>
  </div>
</div>
