<section class="container-fluid px-3 px-lg-5 py-4">
  <!-- Cabeçalho da Página de Produtos -->
  <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 pb-3 border-bottom border-secondary border-opacity-25 gap-3">
    <div>
      <span class="aegon-eyebrow">CATÁLOGO OFICIAL · AEGON MERCH</span>
      <h1 class="h2 fw-extrabold mb-0 text-white" id="products-page-title">Todos os Produtos</h1>
    </div>

    <!-- Busca dedicada na página de produtos -->
    <div class="col-12 col-md-4 col-lg-3">
      <div class="input-group input-group-sm">
        <span class="input-group-text bg-transparent border-secondary text-secondary rounded-start-pill ps-3">
          <svg class="bi bi-search" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
          </svg>
        </span>
        <input
          type="search"
          id="catalog-search-input"
          class="form-control bg-transparent border-secondary text-light rounded-end-pill shadow-none"
          placeholder="Filtrar por nome ou tag..."
          aria-label="Filtrar produtos"
        >
      </div>
    </div>
  </div>

  <!-- Layout estilo template.vercel.shop/search: Sidebar de Filtros + Grid de Produtos -->
  <div class="row g-4">
    <!-- Coluna Esquerda: Incorporação do componente components/filter.html -->
    <aside class="col-12 col-lg-3 col-xl-2" id="filter-container">
      <!-- components/filter.html será injetado aqui -->
    </aside>

    <!-- Coluna Principal: Incorporação do componente components/list-products.html -->
    <div class="col-12 col-lg-9 col-xl-10" id="list-products-container">
      <!-- components/list-products.html será injetado aqui -->
    </div>
  </div>
</section>
